# Modulix API imaji: YALNIZCA ELLE calisir. GitHub'da Actions > "Docker imaji" > "Run workflow" ile baslatilir;
# secilen daldaki kodu derler ve GitHub Container Registry'ye (ghcr.io) iter. Otomatik tetikleyici yoktur.
# (Test sirasinda her main birlestirmesinde imaj uretmek yerine, istendiginde uretilir; Actions dakikasi ve
# kayit alani harcanmaz. Otomatige donmek icin `on:` altina workflow_run veya push tetikleyicisi eklenir.)
# Test ortami imaji su komutlarla ceker:
#   docker pull ghcr.io/gulerseker08-art/modulix-api:main
#   (compose ile: image satirini bu etikete cevirip `docker compose pull api && docker compose up -d api`)
#   Test ortami Development ile calistirilmaz: ASPNETCORE_ENVIRONMENT=Staging ve App__PublicUrl verilmelidir
#   (Development e-posta baglantilarini istek basligindaki Host ile kurar ve OpenAPI/hata sayfasini acar).
# Etiketler: <dal adi> (main secilirse "main"; hep o dalin en son imaji) ve sha-<kisa commit> (geri donus icin degismez).
# Gizli bilgi imaja girmez; yapilandirma calisma aninda ortam degiskenleriyle verilir (tek imaj ilkesi).

name: Docker imaji

on:
  workflow_dispatch:

# Ayni dal icin ust uste elle baslatilirsa eski derleme iptal edilir.
concurrency:
  group: docker-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write  # GITHUB_TOKEN ile ghcr.io'ya yazmak icin

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/modulix-api

jobs:
  publish:
    runs-on: ubuntu-24.04  # sabit: runner imaji degisince derleme sessizce bozulmasin
    timeout-minutes: 30

    steps:
      # "Use workflow from" ile secilen dalin ucundan derlenir (varsayilan: main).
      - name: Kodu al
        uses: actions/checkout@v5

      - name: Buildx kurulumu
        uses: docker/setup-buildx-action@v3

      - name: ghcr.io oturumu
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Depo sahibi adi buyuk harf iceriyorsa imaj adi kucuk harfe cevrilir (registry zorunlulugu).
      - name: Imaj etiketleri
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-,format=short
          labels: |
            org.opencontainers.image.title=Modulix API

      - name: Derle ve it
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Modulix.Api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
