<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Modulix">
  <!-- Modulix işareti, koyu tema sürümü: aynı geometri, lacivert yarı koyu zeminde okunsun diye açık çelik maviye alınmıştır. (referans logo): iki çapraz, uçları eğik kesilmiş şeritten oluşan "X".
       Sol yarı lacivert; "\" şeridi sağ altta maviye, "/" şeridi sağ üstte turkuaza geçer ve ortada üstte durur.
       favicon.png ve icon-192.png aynı geometriden üretilir (docs/design-system/README.md → Marka). -->
  <defs>
    <linearGradient id="mx-blue" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#4F7CB8"/>
      <stop offset="0.42" stop-color="#6E9BD6"/>
      <stop offset="0.62" stop-color="#0E6FB5"/>
      <stop offset="1" stop-color="#1E88D8"/>
    </linearGradient>
    <linearGradient id="mx-teal" gradientUnits="userSpaceOnUse" x1="4" y1="0" x2="60" y2="0">
      <stop offset="0" stop-color="#4F7CB8"/>
      <stop offset="0.42" stop-color="#6E9BD6"/>
      <stop offset="0.62" stop-color="#0AA3C9"/>
      <stop offset="1" stop-color="#3FDDEF"/>
    </linearGradient>
  </defs>
  <!-- "\" şeridi: sol üstten sağ alta -->
  <path fill="url(#mx-blue)" d="M4 8 L9 3 Q43 23 60 55 L55 61 Q21 41 4 8 Z"/>
  <!-- "/" şeridi: sol alttan sağ üste; üstte -->
  <path fill="url(#mx-teal)" d="M4 56 L9 61 Q43 41 60 9 L55 3 Q21 23 4 56 Z"/>
</svg>
